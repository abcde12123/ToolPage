<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏夜工具集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✧</text></svg>">
    <link rel="stylesheet" href="/css/style.css?v=13">
</head>
<body>
    <div id="orbContainer"></div>

    <nav class="navbar">
        <div class="container">
            <a class="navbar__brand" href="/">
                <span class="navbar__logo">✧</span>
                <span>夏夜工具集</span>
            </a>
            <div class="navbar__links">
                <a href="#" class="navbar__link active">首页</a>
                <a href="#" class="navbar__link">工具</a>
                <a href="#" class="navbar__link">关于</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1 class="hero__title">一些小工具 ✨</h1>
            <p class="hero__subtitle">随手做的小工具，希望能帮到你～ 慢慢添加中...</p>
        </div>
    </section>

    <section class="tools">
        <div class="container">
            <div class="tools__grid" id="toolsGrid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>✧ 夏夜工具集 &mdash; <span id="year"></span></p>
            <p class="footer__tag">🚧 持续建设中...</p>
        </div>
    </footer>

    <div id="toolModal" class="modal-overlay" style="display:none;">
        <div class="modal-panel">
            <div class="modal__header">
                <h3 class="modal__title" id="modalTitle"></h3>
                <button class="modal__close" id="modalClose" aria-label="关闭">&#10005;</button>
            </div>
            <div class="modal__body" id="modalBody"></div>
        </div>
    </div>

    <script src="/js/modal.js?v=13"></script>
    <script src="/js/main.js?v=13"></script>
</body>
</html>
