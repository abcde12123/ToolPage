<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="夏夜工具集 - 免费在线工具箱，提供 JSON 格式化、Base64 编解码、时间戳转换、正则测试、色值转换、二维码生成、图片压缩、OCR 文字识别、Markdown 编辑器、密码生成器、文本差异对比、Cron 解析、URL 编解码、随机数生成、单位换算等实用小工具，全部免费使用。">
    <meta name="baidu-site-verification" content="codeva-lwxhldD90Q" />
    <meta name="msvalidate.01" content="09D9E1391CDE5AAB4E25071347D61EB0" />
    <meta name="google-site-verification" content="T_6Y0766SUZgiilVKfz2YIjz0vhfrlf2coeIVUmuCNs" />
    <meta name="google-site-verification" content="ZwpbEwjlcTh965rYx36JnjeBfb3ZMSe1UegLFAu3u_Y" />
    <title>夏夜工具集 - 免费在线工具箱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✧</text></svg>">
    <link rel="stylesheet" href="/css/style.css?v=32">
</head>
<body>
    <div id="orbContainer"></div>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a class="navbar__brand" href="#hero">
                <span class="navbar__logo">✧</span>
                <span>夏夜工具集</span>
            </a>
            <div class="navbar__links">
                <a href="#hero" class="navbar__link active" data-section="hero">首页</a>
                <a href="#tools" class="navbar__link" data-section="tools">工具</a>
                <a href="#about" class="navbar__link" data-section="about">关于</a>
                <button type="button" class="navbar__link navbar__btn-settings" id="btnConsole" title="后台控制台">⚙️ 设置</button>
            </div>
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="container">
            <h1 class="hero__title">一些小工具 ✨</h1>
            <p class="hero__subtitle">随手做的小工具，希望能帮到你～ 慢慢添加中...</p>
        </div>
    </section>

    <section class="tools" id="tools">
        <div class="container">
            <div class="tools__grid" id="toolsGrid"></div>
        </div>
    </section>

    <section class="about" id="about">
        <div class="container">
            <h2 class="about__title">关于本站 ✧</h2>
            <div class="about__content">
                <p>夏夜工具集是一个由个人维护的在线小工具集合，主打毛玻璃质感和轻盈交互体验。</p>
                <p>所有工具均为纯前端实现，数据不会上传到服务器，放心使用～</p>
                <div class="about__info">
                    <span class="about__tag">🪟 毛玻璃设计</span>
                    <span class="about__tag">⚡ 纯原生</span>
                    <span class="about__tag">📦 零依赖</span>
                    <span class="about__tag">🚧 持续更新</span>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>✧ 夏夜工具集 &mdash; <span id="year"></span></p>
            <p class="footer__tag">🚧 持续建设中...</p>
        </div>
    </footer>

    <div id="toolModal" class="modal-overlay" style="display:none;">
        <div class="modal-panel">
            <div class="modal__header">
                <h3 class="modal__title" id="modalTitle"></h3>
                <button class="modal__close" id="modalClose" aria-label="关闭">&#10005;</button>
            </div>
            <div class="modal__body" id="modalBody"></div>
        </div>
    </div>

    <!-- 后台控制台浮层（登录 + 跳转枢纽，签到系统本体在 xiayevfx.cn，这里只负责入口） -->
    <div id="consoleOverlay" class="console-overlay" style="display:none;">
        <!-- 登录视图 -->
        <div class="console-panel console-panel--login" id="consoleLogin">
            <button type="button" class="console__close" id="consoleLoginClose" aria-label="关闭">&#10005;</button>
            <div class="console__icon">&#x1F512;</div>
            <h3 class="console__title">管理员登录</h3>
            <p class="console__subtitle">登录后进入后台控制台</p>
            <form id="consoleLoginForm" novalidate>
                <div class="console__field">
                    <input type="password" id="consolePassword" placeholder="请输入管理密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="console__btn" id="consoleLoginBtn">&#x2713; 登录</button>
            </form>
            <div class="console__msg" id="consoleLoginMsg" hidden></div>
        </div>

        <!-- 控制台视图（跳转枢纽） -->
        <div class="console-panel console-panel--main" id="consoleMain" hidden>
            <button type="button" class="console__close" id="consoleClose" aria-label="关闭">&#10005;</button>
            <div class="console__icon">&#x1F6E0;</div>
            <h3 class="console__title">后台控制台</h3>
            <p class="console__subtitle">选择功能，将跳转到对应页面</p>
            <div class="console__grid">
                <button type="button" class="console-card" id="consoleCardCheckin">
                    <span class="console-card__icon">&#x1F4CB;</span>
                    <span class="console-card__name">签到登记</span>
                    <span class="console-card__desc">打开签到表单页</span>
                </button>
                <button type="button" class="console-card" id="consoleCardAdmin">
                    <span class="console-card__icon">&#x1F4CA;</span>
                    <span class="console-card__name">签到管理</span>
                    <span class="console-card__desc">打开后台管理页</span>
                </button>
            </div>
            <button type="button" class="console__logout" id="consoleLogout">退出登录</button>
        </div>
    </div>

    <script src="/js/modal.js?v=32"></script>
    <script src="/js/console.js?v=32"></script>
    <script src="/js/main.js?v=32"></script>
</body>
</html>
