<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素画编辑器 - 单元测试</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .test-header {
            margin-bottom: 30px;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 8px;
        }
        .test-header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        .test-controls {
            margin-top: 15px;
        }
        .test-btn {
            padding: 10px 20px;
            font-size: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        .test-btn:hover {
            background: #2563eb;
        }
        .test-results {
            margin-top: 30px;
        }
        .test-summary {
            padding: 20px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-summary.success {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .test-summary.failure {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .test-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        .test-item.passed {
            background: #f0fdf4;
            border-left: 4px solid #10b981;
        }
        .test-item.failed {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
        }
        .test-icon {
            font-size: 18px;
            margin-right: 10px;
            min-width: 24px;
        }
        .test-name {
            flex: 1;
            font-weight: 500;
        }
        .test-error {
            margin-left: 34px;
            margin-top: 8px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
            color: #dc2626;
            font-family: monospace;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 16px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-label {
            color: #6b7280;
        }
        .stat-value {
            font-weight: 600;
            font-size: 20px;
        }
        .stat-value.total {
            color: #3b82f6;
        }
        .stat-value.passed {
            color: #10b981;
        }
        .stat-value.failed {
            color: #ef4444;
        }
        .console-output {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            color: #f3f4f6;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="test-header">
        <h1>🧪 像素画编辑器 - 单元测试</h1>
        <p>全面测试像素画工具的功能完整性和稳定性</p>
        <div class="test-controls">
            <button class="test-btn" onclick="runTests()">▶ 运行测试</button>
            <button class="test-btn" onclick="clearResults()">🗑 清除结果</button>
        </div>
    </div>

    <div id="testResults" class="test-results"></div>

    <div id="consoleOutput" class="console-output" style="display:none;"></div>

    <script src="../js/main.js"></script>
    <script src="../js/tools/pixel-art.js"></script>
    <script src="pixel-art.test.js"></script>

    <script>
        var consoleOutputEl = document.getElementById('consoleOutput');
        var originalConsoleLog = console.log;
        var originalConsoleError = console.error;
        var consoleBuffer = '';

        function captureConsole() {
            consoleBuffer = '';
            consoleOutputEl.style.display = 'block';

            console.log = function() {
                var msg = Array.prototype.slice.call(arguments).join(' ');
                consoleBuffer += msg + '\n';
                consoleOutputEl.textContent = consoleBuffer;
                originalConsoleLog.apply(console, arguments);
            };

            console.error = function() {
                var msg = Array.prototype.slice.call(arguments).join(' ');
                consoleBuffer += 'ERROR: ' + msg + '\n';
                consoleOutputEl.textContent = consoleBuffer;
                originalConsoleError.apply(console, arguments);
            };
        }

        function restoreConsole() {
            console.log = originalConsoleLog;
            console.error = originalConsoleError;
        }

        function runTests() {
            var resultsEl = document.getElementById('testResults');
            resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>运行测试中...</p></div>';

            captureConsole();

            setTimeout(function() {
                try {
                    var report = window.runPixelArtTests();
                    displayResults(report);
                } catch (e) {
                    resultsEl.innerHTML = '<div class="test-summary failure"><h2>测试运行失败</h2><p>' + e.message + '</p></div>';
                    console.error('测试运行失败:', e);
                } finally {
                    restoreConsole();
                }
            }, 100);
        }

        function displayResults(report) {
            var resultsEl = document.getElementById('testResults');
            var isSuccess = report.failed === 0;

            var html = '<div class="test-summary ' + (isSuccess ? 'success' : 'failure') + '">';
            html += '<h2>' + (isSuccess ? '✅ 所有测试通过！' : '❌ 部分测试失败') + '</h2>';
            html += '<div class="stats">';
            html += '<div class="stat"><span class="stat-label">总计:</span><span class="stat-value total">' + report.total + '</span></div>';
            html += '<div class="stat"><span class="stat-label">通过:</span><span class="stat-value passed">' + report.passed + '</span></div>';
            html += '<div class="stat"><span class="stat-label">失败:</span><span class="stat-value failed">' + report.failed + '</span></div>';
            html += '<div class="stat"><span class="stat-label">通过率:</span><span class="stat-value ' + (isSuccess ? 'passed' : 'failed') + '">' +
                    (report.passed / report.total * 100).toFixed(1) + '%</span></div>';
            html += '</div>';
            html += '</div>';

            html += '<div class="test-list">';
            report.results.forEach(function(result) {
                html += '<div class="test-item ' + (result.passed ? 'passed' : 'failed') + '">';
                html += '<span class="test-icon">' + (result.passed ? '✓' : '✗') + '</span>';
                html += '<span class="test-name">' + result.name + '</span>';
                html += '</div>';
                if (!result.passed && result.error) {
                    html += '<div class="test-error">' + result.error + '</div>';
                }
            });
            html += '</div>';

            resultsEl.innerHTML = html;
        }

        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            consoleOutputEl.style.display = 'none';
            consoleBuffer = '';
            consoleOutputEl.textContent = '';
        }

        // 页面加载完成后自动运行测试
        window.addEventListener('load', function() {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
