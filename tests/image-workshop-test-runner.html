<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片工坊 - 单元测试</title>
    <link rel="stylesheet" href="../css/image-workshop.css">
    <style>
        body {
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .test-header {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .test-header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #1a202c;
        }
        .test-controls {
            margin-top: 15px;
        }
        .test-btn {
            padding: 10px 20px;
            font-size: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.2s;
        }
        .test-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        .test-results {
            margin-top: 30px;
        }
        .test-summary {
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .test-summary.success {
            border-color: #10b981;
            background: linear-gradient(135deg, #f0fdf4 0%, #d1fae5 100%);
        }
        .test-summary.failure {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2 0%, #fecaca 100%);
        }
        .test-summary h2 {
            margin: 0 0 15px 0;
            color: #1a202c;
        }
        .test-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .test-item.passed {
            border-left: 4px solid #10b981;
        }
        .test-item.failed {
            border-left: 4px solid #ef4444;
        }
        .test-icon {
            font-size: 18px;
            margin-right: 10px;
            min-width: 24px;
        }
        .test-name {
            flex: 1;
            font-weight: 500;
            color: #1a202c;
        }
        .test-error {
            margin-left: 34px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
            font-size: 12px;
            color: #dc2626;
            font-family: 'Consolas', monospace;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 16px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
        }
        .stat-label {
            color: #6b7280;
        }
        .stat-value {
            font-weight: 700;
            font-size: 20px;
        }
        .stat-value.total {
            color: #667eea;
        }
        .stat-value.passed {
            color: #10b981;
        }
        .stat-value.failed {
            color: #ef4444;
        }
        .console-output {
            margin-top: 20px;
            padding: 15px;
            background: #1f2937;
            color: #f3f4f6;
            border-radius: 12px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .test-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="test-header">
        <h1>🧪 图片工坊 - 单元测试</h1>
        <p>全面测试图片编辑工具的功能完整性和稳定性</p>
        <div class="test-controls">
            <button class="test-btn" onclick="runTests()">▶ 运行测试</button>
            <button class="test-btn" onclick="clearResults()">🗑 清除结果</button>
        </div>
    </div>

    <div id="testResults" class="test-results"></div>

    <div id="consoleOutput" class="console-output" style="display:none;"></div>

    <!-- 引入图片工坊的HTML结构（隐藏） -->
    <div style="position: absolute; left: -9999px; top: -9999px;">
        <div id="orbContainer"></div>
        <div id="iwDropzone"></div>
        <input type="file" id="iwFile" accept="image/*">
        <div id="iwCanvasWrap" hidden>
            <canvas id="iwCanvas"></canvas>
            <div id="iwCropOverlay" hidden></div>
        </div>
        <div id="iwEmptyTip" hidden></div>
        <div id="iwFileBadge" hidden></div>
        <div id="iwStatus"></div>
        <button id="iwUndo"></button>
        <button id="iwRedo"></button>
        <button id="iwReset"></button>
        <button id="iwExport"></button>
        <button id="iwBack"></button>
        <button id="btnTheme"></button>
        <select id="iwExportFormat">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
            <option value="image/avif">AVIF</option>
            <option value="image/x-icon">ICO</option>
        </select>
        <input type="range" id="iwQuality" min="0.1" max="1" step="0.05" value="0.9">
        <input type="number" id="iwMaxWidth" min="100" max="8000" value="1920">
        <div id="iwExportNote"></div>
        <div id="iwSizeCompare" hidden>
            <span id="iwSizeBefore"></span>
            <span id="iwSizeAfter"></span>
            <span id="iwSizeDelta"></span>
        </div>
        <div id="iwPanel"></div>
        <div class="iw-tool" data-tool="upload"></div>
        <div class="iw-tool" data-tool="crop"></div>
        <div class="iw-tool" data-tool="rotate"></div>
        <div class="iw-tool" data-tool="color"></div>
        <div class="iw-tool" data-tool="watermark"></div>
        <div class="iw-tool" data-tool="compress"></div>
        <div class="iw-tool" data-tool="format"></div>
        <div class="iw-tool" data-tool="pixel"></div>
    </div>

    <script src="../js/image-workshop.js"></script>
    <script src="image-workshop.test.js"></script>

    <script>
        var consoleOutputEl = document.getElementById('consoleOutput');
        var originalConsoleLog = console.log;
        var originalConsoleError = console.error;
        var consoleBuffer = '';

        function captureConsole() {
            consoleBuffer = '';
            consoleOutputEl.style.display = 'block';

            console.log = function() {
                var msg = Array.prototype.slice.call(arguments).join(' ');
                consoleBuffer += msg + '\n';
                consoleOutputEl.textContent = consoleBuffer;
                originalConsoleLog.apply(console, arguments);
            };

            console.error = function() {
                var msg = Array.prototype.slice.call(arguments).join(' ');
                consoleBuffer += 'ERROR: ' + msg + '\n';
                consoleOutputEl.textContent = consoleBuffer;
                originalConsoleError.apply(console, arguments);
            };
        }

        function restoreConsole() {
            console.log = originalConsoleLog;
            console.error = originalConsoleError;
        }

        function runTests() {
            var resultsEl = document.getElementById('testResults');
            resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>运行测试中...</p></div>';

            captureConsole();

            setTimeout(function() {
                try {
                    var report = window.runImageWorkshopTests();
                    displayResults(report);
                } catch (e) {
                    resultsEl.innerHTML = '<div class="test-summary failure"><h2>测试运行失败</h2><p>' + e.message + '</p></div>';
                    console.error('测试运行失败:', e);
                } finally {
                    restoreConsole();
                }
            }, 100);
        }

        function displayResults(report) {
            var resultsEl = document.getElementById('testResults');
            var isSuccess = report.failed === 0;

            var html = '<div class="test-summary ' + (isSuccess ? 'success' : 'failure') + '">';
            html += '<h2>' + (isSuccess ? '✅ 所有测试通过！' : '❌ 部分测试失败') + '</h2>';
            html += '<div class="stats">';
            html += '<div class="stat"><span class="stat-label">总计:</span><span class="stat-value total">' + report.total + '</span></div>';
            html += '<div class="stat"><span class="stat-label">通过:</span><span class="stat-value passed">' + report.passed + '</span></div>';
            html += '<div class="stat"><span class="stat-label">失败:</span><span class="stat-value failed">' + report.failed + '</span></div>';
            html += '<div class="stat"><span class="stat-label">通过率:</span><span class="stat-value ' + (isSuccess ? 'passed' : 'failed') + '">' +
                    (report.passed / report.total * 100).toFixed(1) + '%</span></div>';
            html += '</div>';
            html += '</div>';

            html += '<div class="test-list">';
            report.results.forEach(function(result) {
                html += '<div class="test-item ' + (result.passed ? 'passed' : 'failed') + '">';
                html += '<span class="test-icon">' + (result.passed ? '✓' : '✗') + '</span>';
                html += '<span class="test-name">' + result.name + '</span>';
                html += '</div>';
                if (!result.passed && result.error) {
                    html += '<div class="test-error">' + result.error + '</div>';
                }
            });
            html += '</div>';

            resultsEl.innerHTML = html;
        }

        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            consoleOutputEl.style.display = 'none';
            consoleBuffer = '';
            consoleOutputEl.textContent = '';
        }

        // 页面加载完成后自动运行测试
        window.addEventListener('load', function() {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
